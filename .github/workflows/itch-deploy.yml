name: Deploy Private Web Test to itch.io

# The only workflow that runs automatically. It validates, runs the full test
# suite, exports the HTML5 build and pushes it to itch.io in one job, so nothing
# else needs to run on a push.
on:
  workflow_dispatch:
  push:
    branches: [main]
    # Documentation-only pushes ship an identical build.
    paths-ignore:
      - "**.md"

concurrency:
  group: itch-web-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Validate and test
        run: |
          godot --headless --path . --editor --quit
          godot --headless --path . --script res://tests/test_runner.gd
          godot --headless --path . --script res://tests/step_cycle_test.gd
          godot --headless --path . --script res://tests/audio_test.gd
          godot --headless --path . --script res://tests/input_integration_test.gd

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html

      - name: Install itch.io butler
        run: |
          curl --fail --location --retry 5 --retry-all-errors \
            --output /tmp/butler.zip \
            https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          mkdir -p /tmp/butler
          unzip -q /tmp/butler.zip -d /tmp/butler
          chmod +x /tmp/butler/butler
          /tmp/butler/butler version

      - name: Validate itch.io HTML5 build
        run: /tmp/butler/butler validate build/web

      - name: Deploy restricted HTML5 build
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLERAPIKEY }}
        run: /tmp/butler/butler push build/web "jungrok5/half:html5" --userversion "${GITHUB_SHA::12}"
