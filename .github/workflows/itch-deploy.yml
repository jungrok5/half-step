name: Deploy Private Web Test to itch.io

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: itch-web-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Validate and test
        run: |
          godot --headless --path . --editor --quit
          godot --headless --path . --script res://tests/test_runner.gd

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html

      - name: Set up itch.io butler
        uses: remarkablegames/setup-butler@v3

      - name: Validate itch.io HTML5 build
        run: butler validate build/web

      - name: Deploy restricted HTML5 build
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: butler push build/web "jungrok5/half:html5" --userversion "${GITHUB_SHA::12}"
