name: Test

# Pull requests and manual runs. Pushes to main are covered by the Pages
# deploy, which runs this same suite before it exports.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot and the web export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/half-step
            ~/.local/share/godot/export_templates
          key: godot-4.7.2-web-v1

      - name: Install Godot
        run: tools/setup_godot.sh
      - name: Import project
        run: godot --headless --path . --editor --quit
      - name: Run gameplay tests
        run: |
          godot --headless --path . --script res://tests/test_runner.gd
          godot --headless --path . --script res://tests/step_cycle_test.gd
          godot --headless --path . --script res://tests/audio_test.gd
          godot --headless --path . --script res://tests/input_integration_test.gd
          godot --headless --path . --script res://tests/progression_test.gd

      - name: Render portrait snapshots
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri
          xvfb-run -a -s "-screen 0 800x1200x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            godot --path . --script res://tools/render_snapshots.gd -- "$PWD/snapshots"

      - name: Upload snapshots
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: portrait-snapshots
          path: snapshots/
          if-no-files-found: ignore
