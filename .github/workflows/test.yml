name: Test

# Manual only. Every push to main already runs this exact suite inside
# "Deploy Private Web Test to itch.io" before it exports, and this repository is
# private, so running it here too spent the account's Actions minutes twice for
# the same result. Run it by hand from the Actions tab when you want the
# snapshots without shipping a build.
on:
  workflow_dispatch:

jobs:
  gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Import project
        run: godot --headless --path . --editor --quit
      - name: Run gameplay tests
        run: |
          godot --headless --path . --script res://tests/test_runner.gd
          godot --headless --path . --script res://tests/step_cycle_test.gd
          godot --headless --path . --script res://tests/audio_test.gd
          godot --headless --path . --script res://tests/input_integration_test.gd

      - name: Render portrait snapshots
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri
          xvfb-run -a -s "-screen 0 800x1200x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            godot --path . --script res://tools/render_snapshots.gd -- "$PWD/snapshots"

      - name: Upload snapshots
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: portrait-snapshots
          path: snapshots/
          if-no-files-found: ignore
