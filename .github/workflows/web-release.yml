name: Web Release

# Manual, plus real version tags. It used to also build on every push to main,
# which produced the same export the itch.io deploy had already built minutes
# earlier.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    # Needed only to attach the ZIP to a GitHub Release on a v* tag.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Validate and test
        run: |
          godot --headless --path . --editor --quit
          godot --headless --path . --script res://tests/test_runner.gd
          godot --headless --path . --script res://tests/step_cycle_test.gd
          godot --headless --path . --script res://tests/audio_test.gd
          godot --headless --path . --script res://tests/input_integration_test.gd
      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
      - name: Package web build
        run: cd build/web && zip -r ../half-step-web-${{ github.ref_name }}.zip .
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: half-step-web-${{ github.ref_name }}
          path: build/half-step-web-${{ github.ref_name }}.zip
      - name: Attach ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/half-step-web-${{ github.ref_name }}.zip
