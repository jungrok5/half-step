name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Documentation-only pushes ship an identical build.
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# Least privilege per job: the build job only ever needs to read the repository,
# so the Pages write and OIDC token permissions stay in the deploy job.
#
# No third-party actions anywhere in this repository. Godot is installed by
# tools/setup_godot.sh — the same script local builds use — instead of a
# marketplace action whose moving tag could change what runs here.
permissions: {}

# Never cancel a deployment that is already publishing; queue behind it.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache Godot and the web export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/half-step
            ~/.local/share/godot/export_templates
          key: godot-4.7.2-web-v1

      - name: Install Godot
        run: tools/setup_godot.sh

      - name: Import project
        run: godot --headless --path . --editor --quit

      - name: Run gameplay tests
        run: |
          godot --headless --path . --script res://tests/test_runner.gd
          godot --headless --path . --script res://tests/step_cycle_test.gd
          godot --headless --path . --script res://tests/audio_test.gd
          godot --headless --path . --script res://tests/input_integration_test.gd
          godot --headless --path . --script res://tests/progression_test.gd

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          test -s build/web/index.wasm
          # Pages serves the artifact directly, but this keeps any Jekyll
          # processing off for good.
          touch build/web/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
